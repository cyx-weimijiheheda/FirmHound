project: fsa
version: "0.1.0"

runtime:
  default: offline
  budget:
    max_tokens_per_run: 100000
    max_calls_per_stage: 20

paths:
  runs: ./runs
  temp: ./tmp
  schemas: ./schemas
  models: ./config/models.yaml

analysis:
  max_binaries: 500
  max_strings_per_binary: 200
  verify_top_k: 5

# Optional Ghidra headless enrichment for the DECOMPILE stage. When Ghidra is
# unavailable the stage degrades to the pyelftools fallback and the pipeline continues.
decompile:
  backend: auto                    # auto | ghidra | fallback
  ghidra_headless: ""              # empty -> GHIDRA_HEADLESS or analyzeHeadless on PATH
  max_binaries: 5                  # top-N by triage score
  timeout_s: 600

# --------------------------------------------------------------------------- #
# Bounded agent loop (optional; disabled by default)
#
# The loop collects facts for existing candidates. The model ranks the
# rule-generated action list; tool names, paths, parameters and conclusions
# come from code. `tier=dynamic|external` is an explicit opt-in.
# --------------------------------------------------------------------------- #
agent:
  enabled: false
  tier: standard            # standard | dynamic | external
  runtime: ""               # empty -> runtime.default
  max_candidates: 10
  max_steps: 20
  max_steps_per_candidate: 4
  max_tool_calls: 40
  max_seconds: 120
  no_progress_limit: 2
  max_action_failures: 3
  max_binary_size_mb: 64
  model:
    enabled: auto           # auto | true | false
    max_calls: 8
    max_tokens: 4000
    allow_public: false     # set true for an explicitly allowed remote endpoint
  progress:
    every_steps: 10         # report agent progress every N steps
    show_tokens: true       # include token/call counters in the progress line
    show_model: false       # print the validated model choice (not raw prompt/reply)
  dynamic:
    enabled: false
    require_authorized_emulation: true
    qemu_load_check:
      timeout_s: 30
  external:
    enabled: false
    klee:
      enabled: false
      max_time_s: 600
      max_forks: 64
      max_depth: 200
      solver: z3
    bond:
      enabled: false        # reserved; v1 does not run BOND inside the loop

safety:
  config: config/safety.yaml
  enforce: true

logging:
  level: INFO
  format: jsonl
  destination: ./runs/logs

# --------------------------------------------------------------------------- #
# External analyzers (SaTC / FirmRec / KLEE / BOND)
#
# Every tool is DISABLED by default. The orchestrator discovers them through
# tools/registry/external.yaml, and runs each tool whose `enabled` is true.
# The whole `external` block is also gated by the top-level `enabled` flag, so
# setting it to false turns off the entire external track regardless of per-tool
# flags. This is the F7 degradation safety net: with everything off, the pipeline
# behaves exactly as it did before external integration.
# --------------------------------------------------------------------------- #
external:
  enabled: false
  workdir: ./tmp/external          # must stay inside ./tmp (safety whitelist)
  timeout_s: 3600                  # per-invocation hard timeout for one analyzer

  satc:
    enabled: false
    image: smile0304/satc          # docker image; pulled on first enabled run
    taint_check: true             # angr taint engine (much slower when on)
    scripts:                       # Ghidra scripts to run, in order
      - ref2sink_cmdi
      - ref2sink_bof
      - ref2share
    enable_share2sink: true        # cross-process (nvram/env) taint; needs ref2share out
    max_bins: 3                    # Top-N border binaries; -l N when none given
    memory: 16g                    # Ghidra headroom; lower if host RAM is tight

  firmrec:
    enabled: false
    # Recurring-vulnerability detection. Requires a known-vuln signature DB and
    # is isolated from blind benchmark runs.
    backend: auto                  # auto | local | docker
    # Native backend (recommended). repo_dir must be inside a safety-whitelisted
    # path (e.g. ./vendor/FirmRec) or explicitly added to config/safety.yaml.
    repo_dir: ""                   # or FSA_FIRMREC_REPO_DIR
    python_bin: ""                 # FirmRec Python 3.9 env; or FSA_FIRMREC_PYTHON_BIN
    ghidra_headless: ""            # /opt/ghidra/support/analyzeHeadless
    firmrec_static_jar: ""         # default <repo_dir>/firmentry/firmrec-static.jar
    pg_user: root
    pg_password: firmrec           # or FSA_FIRMREC_PG_PASSWORD
    pg_database: ""                # default firmrec_<run_id> (per-run isolation)
    vendor: unknown                # staged images/<VENDOR>/ directory
    image_name: ""                 # optional override for the staged image name
    allow_rootfs_tar: true         # rootfs-only runs are packed as a tar (limited)
    # Docker fallback.
    image: xylearn/firmrec-base    # pulled on first enabled docker run
    # Upstream vuln_info (<VENDOR>/<NAME>/meta.json + vulnerable firmware).
    vuln_info_dir: ""              # operator-prepared upstream tree (preferred)
    official_vuln_info_path: ""    # upstream directory when vuln_info_source=official
    vuln_firmware_dir: ""          # our mode: <CVE>/<firmware image> + input descriptor
    signature_db: ./benchmarks/CVEs
    vuln_info_source: our          # our | official (our = fixture/methodology mode)
    mode: signature_only           # blind runs keep this disabled
    timeout_s: 7200                # pipeline + PostgreSQL warm-up cap
    llm_key: ""                    # optional; upstream input-entry search
    llm_url: ""                    # full chat/completions endpoint
    llm_model: ""

  klee:
    enabled: false
    # Symbolic execution. Needs LLVM bitcode (wllvm) or a lifted binary harness.
    harness: auto                  # auto | source | binary
    max_time_s: 14400              # 4h cap per harness (S3 binary-lift hard stop)
    backend: auto                  # auto | local | docker (KLEE runs via LLVM bitcode)
    solver: z3                     # KLEE solver backend (z3 recommended; stp also supported)
    image: kleever/klee:llvm-16    # docker image (LLVM 16 + Z3 + KLEE 3.2) when backend=docker
    llvm: "16"                     # LLVM toolchain version expected by the backend
    max_forks: 64                  # path-explosion guard (--max-forks)
    max_depth: 200                 # path-explosion guard (--max-depth)
    search: dfs                    # KLEE search strategy

  bond:
    enabled: false
    # Constraint-directed fuzzing (mini-BOND). PoC outputs are sanitized before persistence.
    target: emulation              # target is limited to emulation instances
    target_ip: ""                  # MUST be a private RFC1918 address when emulation is live (safety gate)
    target_port: 80                # HTTP port exposed by the isolated emulator
    authorized: false              # operator authorization -> must be true to fuzz
    local_lab: false               # lab context flag
    baseline_ready: false          # clean-baseline snapshot flag (for crash diffing)
    simulate: true                 # fixture-only switch; this mode is skipped and records no finding
    request_timeout_s: 5           # per-request timeout; response bodies are capped and hashed
    trigger_marker: ""             # explicit harmless response marker required for triggered=true
    probe_parameter: ""            # explicit injectable parameter; empty disables marker probe
    probe_value: "echo LAB_MARKER" # harmless marker value, used only with probe_parameter+trigger_marker
    max_seeds: 12                  # scheduler seed budget (priority-aware)
    use_ghidra: false              # when true, invoke a real Ghidra headless CFG/CG export
